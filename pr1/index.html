<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин косметики</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="product-card product-card--sale">
        <!-- Фото товара -->
        <img src="Hourglass Makeup | Hourglass Ambient Palette Swan | Color_ Pink_Red | Size_ Os.jpg" 
             alt="Крем для лица" 
             class="product-card__image">
        
        <!-- Название товара -->
        <h3 class="product-card__title">Лимитированная палетка для макияжа HOURGLASS</h3>
        
        <!-- Описание товара -->
        <p class="product-card__description">
            Шесть оттенков румян, бронзера и хайлайтера. Они рассеивают, подчеркивают и придают коже сияние, делая ее более выразительной и отдохнувшей.
        </p>
        
        <!-- Цена (кнопки больше нет) -->
        <div class="product-card__price">18 500 ₽</div>
    </div>
</body>
</html>
