<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заметки (PWA)</title>
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4285f4">
    <link rel="apple-touch-icon" href="/icons/favicon-152x152.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="icons/favicon.ico" sizes="16x16" type="image/ico">
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
</head>
<body>
    <div class="container" style="margin-top: 2rem;">
        <h1>📝 Мои заметки</h1>
        <form id="note-form" class="row">
            <input class="col-9" type="text" id="note-input" placeholder="Введите заметку" required>
            <button class="col-3 button primary" type="submit">Добавить</button>
        </form>
        <ul id="notes-list" style="list-style: none; padding-left: 0;"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
